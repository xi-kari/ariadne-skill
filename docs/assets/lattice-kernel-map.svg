<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Lattice Kernel 方法论地图：一个总路由协调九个可按需独立、连续或集群工作的平级模块">
  <title>Lattice Kernel 方法论地图</title>
  <defs>
    <style>
      .serif { font-family: "Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif; }
      .mono { font-family: "IBM Plex Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace; }
    </style>
    <marker id="map-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5E948B"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="649" fill="#EDF2EF" stroke="#B7CBC4"/>
  <g stroke="#B7CBC4" stroke-width="1" opacity="0.45">
    <line x1="250" y1="0" x2="250" y2="650"/>
    <line x1="490" y1="0" x2="490" y2="650"/>
    <line x1="760" y1="0" x2="760" y2="650"/>
    <line x1="1000" y1="0" x2="1000" y2="650"/>
    <line x1="0" y1="102" x2="1200" y2="102"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <text class="mono" x="64" y="48" font-size="14" font-weight="600" letter-spacing="4" fill="#315F58">方法论地图 · 一总路由 + 九个平级模块</text>
  <text class="serif" x="64" y="84" font-size="25" font-weight="700" fill="#173532">Lattice Kernel 按问题需要组织方法，不要求每次把全部模块跑一遍。</text>

  <g class="mono" font-size="11" font-weight="600" letter-spacing="1" fill="#315F58" text-anchor="middle">
    <text x="148" y="122">总路由</text>
    <text x="369" y="122">共同冻结</text>
    <text x="601" y="122">可并行分析</text>
    <text x="863" y="122">按需进入</text>
    <text x="1088" y="122">合并与治理</text>
  </g>

  <g fill="none" stroke="#5E948B" stroke-width="2">
    <path d="M 232 327 H 260 V 252 H 286" marker-end="url(#map-arrow)"/>
    <path d="M 260 327 V 402 H 286" marker-end="url(#map-arrow)"/>
    <path d="M 452 252 H 480 V 402 H 452"/>
    <path d="M 480 327 H 500 V 188 H 516" marker-end="url(#map-arrow)"/>
    <path d="M 500 327 H 516" marker-end="url(#map-arrow)"/>
    <path d="M 500 327 V 466 H 516" marker-end="url(#map-arrow)"/>
    <path d="M 686 188 H 720 V 466 H 686"/>
    <path d="M 686 327 H 720"/>
    <path d="M 948 188 H 980 V 466 H 948"/>
    <path d="M 948 327 H 980"/>
    <path d="M 980 327 H 1012" marker-end="url(#map-arrow)"/>
  </g>
  <g fill="none" stroke="#8B62AD" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#map-arrow)">
    <path d="M 720 188 H 778"/>
    <path d="M 720 327 H 778"/>
    <path d="M 720 466 H 778"/>
    <path d="M 720 327 V 538 H 988 V 389 H 1012"/>
  </g>

  <g>
    <rect x="64" y="250" width="168" height="154" rx="10" fill="#173532"/>
    <text class="mono" x="148" y="302" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">ariadne-skill</text>
    <text class="serif" x="148" y="338" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">总路由</text>
    <text class="serif" x="148" y="370" font-size="13" fill="#DCEAE5" text-anchor="middle">分类 · 选择 · 合并</text>
  </g>

  <g>
    <rect x="286" y="198" width="166" height="108" rx="9" fill="#F7FAF8" stroke="#5E948B" stroke-width="2"/>
    <text class="mono" x="369" y="234" font-size="12" font-weight="700" fill="#173532" text-anchor="middle">ariadne-framing</text>
    <text class="serif" x="369" y="270" font-size="17" font-weight="700" fill="#315F58" text-anchor="middle">冻结对象与边界</text>

    <rect x="286" y="348" width="166" height="108" rx="9" fill="#F7FAF8" stroke="#5E948B" stroke-width="2"/>
    <text class="mono" x="369" y="384" font-size="12" font-weight="700" fill="#173532" text-anchor="middle">ariadne-evidence</text>
    <text class="serif" x="369" y="420" font-size="17" font-weight="700" fill="#315F58" text-anchor="middle">冻结证据截止点</text>
  </g>

  <g>
    <rect x="516" y="134" width="170" height="108" rx="9" fill="#E7DDED" stroke="#8B62AD" stroke-width="2"/>
    <text class="mono" x="601" y="171" font-size="12" font-weight="700" fill="#5F4271" text-anchor="middle">ariadne-scale</text>
    <text class="serif" x="601" y="207" font-size="17" font-weight="700" fill="#6E4D82" text-anchor="middle">尺度转换</text>

    <rect x="516" y="273" width="170" height="108" rx="9" fill="#E7DDED" stroke="#8B62AD" stroke-width="2"/>
    <text class="mono" x="601" y="310" font-size="12" font-weight="700" fill="#5F4271" text-anchor="middle">ariadne-mechanism</text>
    <text class="serif" x="601" y="346" font-size="17" font-weight="700" fill="#6E4D82" text-anchor="middle">机制比较</text>

    <rect x="516" y="412" width="170" height="108" rx="9" fill="#E7DDED" stroke="#8B62AD" stroke-width="2"/>
    <text class="mono" x="601" y="449" font-size="12" font-weight="700" fill="#5F4271" text-anchor="middle">ariadne-human</text>
    <text class="serif" x="601" y="485" font-size="17" font-weight="700" fill="#6E4D82" text-anchor="middle">人类领域约束</text>
  </g>

  <g>
    <rect x="778" y="134" width="170" height="108" rx="9" fill="#F7FAF8" stroke="#5E948B" stroke-width="2"/>
    <text class="mono" x="863" y="171" font-size="12" font-weight="700" fill="#173532" text-anchor="middle">ariadne-dynamics</text>
    <text class="serif" x="863" y="207" font-size="17" font-weight="700" fill="#315F58" text-anchor="middle">动态推演</text>

    <rect x="778" y="273" width="170" height="108" rx="9" fill="#F7FAF8" stroke="#5E948B" stroke-width="2"/>
    <text class="mono" x="863" y="310" font-size="12" font-weight="700" fill="#173532" text-anchor="middle">ariadne-forecast</text>
    <text class="serif" x="863" y="346" font-size="17" font-weight="700" fill="#315F58" text-anchor="middle">条件前瞻</text>

    <rect x="778" y="412" width="170" height="108" rx="9" fill="#F4E8DD" stroke="#C4874F" stroke-width="2"/>
    <text class="mono" x="863" y="449" font-size="12" font-weight="700" fill="#70482E" text-anchor="middle">ariadne-choice</text>
    <text class="serif" x="863" y="485" font-size="17" font-weight="700" fill="#805333" text-anchor="middle">有限选择</text>
  </g>

  <g>
    <rect x="1012" y="250" width="152" height="154" rx="10" fill="#5F4271"/>
    <text class="mono" x="1088" y="302" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">ariadne-audit</text>
    <text class="serif" x="1088" y="338" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">审计与治理</text>
    <text class="serif" x="1088" y="370" font-size="13" fill="#F0E8F4" text-anchor="middle">合并 · 降级 · 回滚</text>
  </g>

  <text class="serif" x="601" y="594" font-size="16" font-weight="700" fill="#244B47" text-anchor="middle">对象与证据冻结后，尺度、机制与人类领域可并行；其余模块按任务需要进入。</text>
  <text class="mono" x="601" y="622" font-size="12" letter-spacing="2" fill="#805333" text-anchor="middle">按需选取 · 不以模块数量制造证据 · 不以流程完成制造授权</text>
</svg>
