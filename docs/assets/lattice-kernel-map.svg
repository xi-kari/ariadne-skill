<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">一条可以继续的工作线</title>
  <desc id="map-desc">用户目标与已有材料进入按需组合的方法工作。理解、发现、推演、选择、构建与复核可以交叉，并非固定流水线。输出是有据的结果或具体成品；新证据、异议和变化的约束返回受影响的工作，有效结果继续保留。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#ad3827" stroke-width="1.6"/></marker></defs>
  <rect width="1200" height="400" fill="#edede3"/>
  <g fill="none" stroke="#ad3827" stroke-width="2" marker-end="url(#arrow)">
    <path d="M244 166H331"/>
    <path d="M821 166H902"/>
    <path d="M1050 259V307Q1050 337 1019 337H561Q530 337 530 307V272"/>
  </g>
  <circle cx="44" cy="166" r="6" fill="#ad3827"/>
  <path d="M50 166H77" stroke="#ad3827" stroke-width="2"/>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <text x="79" y="121" font-size="12" fill="#65675e" letter-spacing="2">从这里出发</text>
    <text x="79" y="173" font-size="30" fill="#24251f">用户目标</text>
    <text x="79" y="210" font-size="18" fill="#65675e">已有材料与实际限制</text>
  </g>
  <rect x="349" y="65" width="452" height="207" rx="2" fill="#f7f4ed" stroke="#c9cbbd"/>
  <path d="M374 65H470" stroke="#ad3827" stroke-width="3"/>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">
    <text x="575" y="109" font-size="12" fill="#65675e" letter-spacing="2">按需要组合，不必全部走一遍</text>
    <g font-size="24" fill="#24251f"><text x="432" y="163">理解</text><text x="575" y="163">发现</text><text x="717" y="163">推演</text><text x="432" y="211">选择</text><text x="575" y="211">构建</text><text x="717" y="211">复核</text></g>
    <text x="575" y="248" font-size="12" fill="#65675e">共同推理操作 · 按需读取的资料</text>
  </g>
  <g fill="#fffdf8" stroke="#c9cbbd"><path d="M927 90H1154V257H927Z" transform="rotate(3 1040 173)"/><path d="M917 84H1144V251H917Z"/></g>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <text x="938" y="117" font-size="12" fill="#65675e" letter-spacing="1">完成实际终点</text>
    <text x="938" y="163" font-size="26" fill="#24251f">有据的结果</text>
    <text x="938" y="201" font-size="26" fill="#ad3827">具体的成品</text>
    <text x="938" y="233" font-size="12" fill="#65675e">保存 · 检查 · 交付</text>
  </g>
  <rect x="643" y="320" width="320" height="33" fill="#edede3"/>
  <text x="803" y="342" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#ad3827">新证据 / 异议 / 变化的约束</text>
  <text x="44" y="378" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#65675e">修订受影响的部分，保留仍然有效的结果。</text>
</svg>
