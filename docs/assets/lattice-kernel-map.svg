<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="km-title">
  <title id="km-title">Lattice Kernel 方法地图：复杂请求经总路由分类后，先由 ariadne-framing 冻结对象、ariadne-evidence 冻结证据截止点；尺度、机制、人类领域三个模块可在同对象同截止点的准入条件下并行；动态、前瞻、选择按任务需要进入；最后由 ariadne-audit 合并——输出上限取最小、冲突具名保留，产出白话判断与 Method Record 两层输出。</title>
