  </g>
  <rect x="830" y="426" width="320" height="64" fill="#FFFDF6" stroke="#1B1A17" stroke-width="1.5"/>
  <text x="990" y="451" font-family="system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#1B1A17" text-anchor="middle">两层输出：白话判断＋方法记录</text>
  <text x="990" y="472" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="11" fill="#2E5F8A" text-anchor="middle">plain answer + Method Record</text>
