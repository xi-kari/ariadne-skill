    <pattern id="km-grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#B4C9DA" stroke-width="1"/>
    </pattern>
    <marker id="km-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#B03A2E"/>
    </marker>
  </defs>
