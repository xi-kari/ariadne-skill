<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Ariadne：把复杂问题，做成有据的成果</title>
  <desc id="hero-desc">暖白纸面上，一条朱红色的线从问题延伸到材料、候选和成果，再接向下一次修订。图形不规定固定步骤或模块数量。</desc>
  <rect width="1200" height="430" fill="#f7f4ed"/>
  <path d="M0 429H1200" stroke="#d9d7cc"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="94" fill="#24251f">
    <text x="52" y="137" letter-spacing="-6">ariadne<tspan fill="#ad3827">.</tspan></text>
  </g>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#24251f">
    <text x="55" y="226" font-size="35" font-weight="500">把复杂问题，</text>
    <text x="55" y="278" font-size="35" font-weight="500">做成<tspan fill="#ad3827">有据的成果。</tspan></text>
    <text x="56" y="334" font-size="15" fill="#65675e">一个入口 · 按任务组合 · 交付后继续</text>
  </g>
  <text x="56" y="384" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="2" fill="#ad3827">A THREAD THROUGH COMPLEXITY</text>
  <path d="M615 81C686 81 612 153 688 153H1076C1168 153 1169 302 1089 302H709C640 302 643 384 737 384H1129" fill="none" stroke="#ad3827" stroke-width="2"/>
  <circle cx="615" cy="81" r="5" fill="#ad3827"/>
  <circle cx="1129" cy="384" r="5" fill="#ad3827"/>
  <g transform="rotate(-5 827 117)">
    <rect x="684" y="43" width="292" height="142" fill="#edede3"/>
    <path d="M684 43H976" stroke="#ad3827" stroke-width="2"/>
    <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <text x="708" y="76" font-size="12" fill="#65675e">从一个具体问题开始</text>
      <text x="708" y="113" font-size="22" fill="#24251f">理解它，发现遗漏，</text>
      <text x="708" y="146" font-size="22" fill="#24251f">再做出一个可检查的结果。</text>
    </g>
  </g>
  <g transform="rotate(4 947 255)">
    <rect x="797" y="168" width="312" height="178" fill="#deded0" opacity=".4" transform="translate(8 8)"/>
    <rect x="797" y="168" width="312" height="178" fill="#fffdf8" stroke="#d9d7cc"/>
    <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <text x="820" y="198" font-size="11" fill="#65675e">成果可以是一份判断，也可以是一件成品</text>
      <path d="M820 212H1086" stroke="#d9d7cc"/>
      <text x="820" y="249" font-size="26" fill="#24251f">有依据。可核对。</text>
      <text x="820" y="286" font-size="26" fill="#ad3827">还能继续。</text>
      <text x="820" y="324" font-size="12" fill="#65675e">新材料到来，沿着受影响的部分修订。</text>
    </g>
  </g>
</svg>
