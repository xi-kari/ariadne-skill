<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Ariadne，由 Lattice Kernel 驱动、帮助 AI Agent 思考和处理复杂问题的方法论集群">
