<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="rh-title">
  <title id="rh-title">Ariadne 图册封面：米白图纸上的格点阵，一条红色直角走线从总路由出发依次穿过九个方法论模块节点；左侧为 ARIADNE 图名与标语「一套让 AI Agent 思考和处理复杂问题的方法论集群」。</title>
  <defs>
    <pattern id="rh-grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#B4C9DA" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" fill="#F5F2E9"/>
  <rect x="11" y="11" width="1178" height="318" fill="url(#rh-grid)"/>
  <rect x="10" y="10" width="1180" height="320" fill="none" stroke="#1B1A17" stroke-width="2"/>
  <rect x="17" y="17" width="1166" height="306" fill="none" stroke="#1B1A17" stroke-width="1"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace">
    <text x="48" y="66" font-size="13" letter-spacing="3" fill="#2E5F8A">LATTICE KERNEL · SHEET SET 00-07</text>
    <text x="44" y="158" font-size="84" font-weight="500" letter-spacing="4" fill="#1B1A17">ARIADNE</text>
    <line x1="48" y1="184" x2="150" y2="184" stroke="#2E5F8A" stroke-width="1"/>
    <text x="162" y="188" font-size="12" letter-spacing="1" fill="#2E5F8A">1 ROUTER + 9 MODULES</text>
    <line x1="352" y1="184" x2="560" y2="184" stroke="#2E5F8A" stroke-width="1"/>
  </g>
  <text x="48" y="238" font-family="'STFangsong', 'FangSong', 'FangSong_GB2312', 'Noto Serif CJK SC', 'Songti SC', SimSun, serif" font-size="30" fill="#1B1A17">一套让 AI Agent 思考和处理复杂问题的方法论集群</text>
  <text x="48" y="268" font-family="system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#5B5850">先定界、再证据；模块按需进入，结论止步于受支持的输出上限。</text>
  <g>
    <polyline points="700,70 1080,70 1080,140 790,140 790,210 1080,210" fill="none" stroke="#B03A2E" stroke-width="2"/>
    <g fill="#FFFDF6" stroke="#1B1A17" stroke-width="1.5">
      <circle cx="700" cy="70" r="8"/>
      <circle cx="790" cy="70" r="6"/>
      <circle cx="935" cy="70" r="6"/>
      <circle cx="1080" cy="70" r="6"/>
      <circle cx="790" cy="140" r="6"/>
      <circle cx="935" cy="140" r="6"/>
      <circle cx="1080" cy="140" r="6"/>
      <circle cx="790" cy="210" r="6"/>
      <circle cx="935" cy="210" r="6"/>
      <circle cx="1080" cy="210" r="6"/>
    </g>
    <circle cx="700" cy="70" r="3.5" fill="#B03A2E"/>
    <g font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="10" fill="#5B5850" text-anchor="middle">
      <text x="700" y="52">RTR</text>
      <text x="790" y="92">FRA</text>
      <text x="935" y="92">EVD</text>
      <text x="1080" y="92">SCL</text>
      <text x="790" y="162">MEC</text>
      <text x="935" y="162">HUM</text>
      <text x="1080" y="162">DYN</text>
      <text x="790" y="232">FOR</text>
      <text x="935" y="232">CHO</text>
      <text x="1080" y="232">AUD</text>
    </g>
  </g>
  <line x1="10" y1="284" x2="1190" y2="284" stroke="#1B1A17" stroke-width="2"/>
  <line x1="430" y1="284" x2="430" y2="323" stroke="#1B1A17" stroke-width="1"/>
  <line x1="700" y1="284" x2="700" y2="323" stroke="#1B1A17" stroke-width="1"/>
  <line x1="920" y1="284" x2="920" y2="323" stroke="#1B1A17" stroke-width="1"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace">
    <g font-size="10" letter-spacing="1.5" fill="#2E5F8A">
      <text x="30" y="303">PROJECT</text>
      <text x="450" y="303">SHEET</text>
      <text x="720" y="303">CHANNEL</text>
      <text x="940" y="303">AUTHORIZATION_EFFECT</text>
    </g>
    <g font-size="14" fill="#1B1A17">
      <text x="30" y="320">ARIADNE · LATTICE KERNEL</text>
      <text x="450" y="320">ARIADNE-00 · COVER</text>
      <text x="720" y="320">ROLLING-MAIN</text>
      <text x="940" y="320" fill="#B03A2E">NONE</text>
    </g>
  </g>
</svg>
