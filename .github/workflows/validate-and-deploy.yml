name: Validate and deploy Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run tests
        run: python -X utf8 -B -m pytest -q -p no:cacheprovider
      - name: Validate repository
        run: python -X utf8 -B scripts/validate_repo.py
      - name: Validate evaluations
        run: python -X utf8 -B scripts/validate_evals.py
      - name: Validate agent adapters
        run: python -X utf8 -B scripts/validate_adapters.py
      - name: Build static site
        run: python -X utf8 -B scripts/build_site.py --output build/site
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
