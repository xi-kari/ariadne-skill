name: 缺陷报告
description: 报告可复现的 Skill、适配器、验证器或网站问题。
title: "[Bug] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢报告。安全漏洞请使用私密安全报告渠道，不要提交公开 Issue。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 请填写提交 SHA，或 main 加测试日期。
      placeholder: main@0123456789abcdef
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Agent Host
      description: 请选择复现问题的宿主。
      options:
        - Codex
        - Claude Code
        - Gemini CLI
        - Cursor
        - GitHub Copilot
        - Reasonix
        - 直接仓库路径测试
        - 其他
    validations:
      required: true

  - type: dropdown
    id: skill
    attributes:
      label: 具体 Skill
      description: 请选择直接受影响的 Skill。
      options:
        - ariadne-skill
        - ariadne-framing
        - ariadne-evidence
        - ariadne-scale
        - ariadne-mechanism
        - ariadne-human
        - ariadne-dynamics
        - ariadne-forecast
        - ariadne-choice
        - ariadne-audit
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供最小、确定且可重复的步骤。
      placeholder: |
        1. 使用……
        2. 调用……
        3. 观察……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      description: 仅粘贴必要片段；删除令牌、密钥、个人资料、私密案例内容和本地敏感路径。
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认本报告不含秘密、凭据、个人资料或未经授权披露的案例材料。
          required: true
