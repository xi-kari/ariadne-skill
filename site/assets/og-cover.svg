<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">Ariadne：把复杂问题，做成有据的成果</title>
  <desc id="og-desc">暖白背景、墨色字与朱红色线索。问题经由可组合的方法成为成果，再沿着新材料继续。</desc>
  <rect width="1200" height="630" fill="#f7f4ed"/>
  <text x="66" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="77" letter-spacing="-5" fill="#24251f">ariadne<tspan fill="#ad3827">.</tspan></text>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="58" font-weight="500">
    <text x="66" y="260" fill="#24251f">把复杂问题，</text>
    <text x="66" y="350" fill="#ad3827">做成有据的成果。</text>
  </g>
  <text x="70" y="422" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#65675e">一个入口。按任务组合。交付之后，还能继续。</text>
  <path d="M75 504H549C628 504 565 108 665 108H1033C1151 108 1148 492 1049 492H747C670 492 701 572 777 572H1121" fill="none" stroke="#ad3827" stroke-width="2.5"/>
  <circle cx="75" cy="504" r="6" fill="#ad3827"/><circle cx="1121" cy="572" r="6" fill="#ad3827"/>
  <g transform="rotate(4 909 290)">
    <rect x="755" y="176" width="300" height="252" fill="#deded0" opacity=".35" transform="translate(12 12)"/>
    <rect x="755" y="176" width="300" height="252" fill="#fffdf8" stroke="#d9d7cc"/>
    <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <text x="781" y="215" font-size="13" fill="#65675e">一条可以继续的工作线</text>
      <path d="M781 231H1029" stroke="#d9d7cc"/>
      <text x="781" y="285" font-size="29" fill="#24251f">从问题出发。</text>
      <text x="781" y="334" font-size="29" fill="#24251f">让成果落地。</text>
      <text x="781" y="391" font-size="16" fill="#ad3827">接着新的证据，继续。</text>
    </g>
  </g>
  <text x="70" y="577" font-family="ui-monospace, Consolas, monospace" font-size="12" letter-spacing="2" fill="#65675e">ARIADNE / LATTICE KERNEL</text>
</svg>
